<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Verified store lookup short-circuits to output on a hit. Otherwise a CST scan builds the checklist and slices, fields route to a labeler agent, a cross-check verifier, or escalation with tools, all feeding a deterministic audit gate before output and promotion.</desc>
