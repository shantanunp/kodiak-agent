plugins {
    id 'java'
    // Gradle 9+: use GradleUp fork (old com.github.johnrengelman.shadow is Gradle 8-only)
    id 'com.gradleup.shadow' version '8.3.6'
}

group = 'com.kodiak'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.javaparser:javaparser-core:3.26.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.yaml:snakeyaml:2.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('shadowJar') {
    archiveBaseName.set('kodiak-indexer')
    archiveClassifier.set('')
    archiveVersion.set('')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'com.kodiak.indexer.IndexerCli'
    }
    // Avoid "Could not add META-INF to ZIP" when a previous run left a corrupt/empty jar.
    doFirst {
        def out = archiveFile.get().asFile
        if (out.exists()) {
            out.delete()
        }
    }
}

tasks.named('build') {
    dependsOn shadowJar
}
