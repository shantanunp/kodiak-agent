<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Define structures — Kodiak Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/kodiak-ui.css">
<style>
  .columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px;align-items:start;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px 20px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .panel-title{font-family:var(--font-display);font-weight:600;font-size:15px;}
  .panel-title.src{color:var(--source);}
  .panel-title.dst{color:var(--target);}
  .fmt-pill{font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:20px;background:var(--bg);color:var(--ink-soft);border:1px solid var(--line);}
  .method-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .method-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;}
  .method-card:hover{border-color:var(--ink-faint);}
  .method-card.selected{border-color:var(--ink);background:var(--bg);}
  .method-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--bg);color:var(--ink-soft);}
  .method-title{font-size:13.5px;font-weight:600;color:var(--ink);}
  .method-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
  .back-link{font-size:12px;color:var(--ink-faint);cursor:pointer;margin-bottom:12px;display:inline-block;}
  .back-link:hover{color:var(--ink);}
  .dropzone{border:1.5px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;margin-bottom:14px;}
  .dropzone-text{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .file-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:12.5px;padding:7px 14px;border-radius:7px;cursor:pointer;font-family:var(--font-body);}
  .parse-status{font-size:12px;margin-top:10px;}
  .parse-status.ok{color:var(--source);}
  .parse-status.warn{color:var(--target);}
  .parse-status.error{color:var(--cond);}
  .tree-preview{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.6;}
  .manual-note{font-size:12.5px;color:var(--ink-soft);line-height:1.5;padding:12px;background:var(--bg);border-radius:8px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="brand-mark"><span></span></div><h1>New mapping</h1></div>
    <p class="tagline">Define what a source record looks like, and what the target should look like — then map between them.</p>
    <div class="mapper-bar">
      <label for="mapperId">Mapper id</label>
      <input id="mapperId" type="text" placeholder="e.g. my-new-mapper" />
    </div>
  </header>

  <div class="columns">
    <div class="panel" id="panel-source"></div>
    <div class="panel" id="panel-destination"></div>
  </div>

  <div class="continue-row">
    <span class="continue-hint" id="continueHint"></span>
    <button class="continue-btn" id="continueBtn" disabled>Continue &rarr;</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import {
  TYPES, METHODS, newNode, emptyRoot, countNodes, toast, getMapperId, requireMapperId,
  saveDraft, loadDraft, parseViaApi, buildSchemaDocument, saveSchemaDoc
} from "/shared/schema-ui.js";

const SIDE_KEYS = { source: "source", destination: "target" };

const state = {
  source: { method: null, format: null, root: emptyRoot("source"), filename: null, status: null },
  destination: { method: null, format: null, root: emptyRoot("destination"), filename: null, status: null },
};

function sideKey(side) {
  return side === "source" ? "source" : "target";
}

function renderMethodCards(side) {
  return `<div class="method-grid">${METHODS.map(m => `
    <div class="method-card ${state[side].method === m.id ? "selected" : ""}" data-side="${side}" data-method="${m.id}">
      <div class="method-icon">${m.icon}</div>
      <div><div class="method-title">${m.title}</div><div class="method-desc">${m.desc}</div></div>
    </div>`).join("")}</div>`;
}

function renderTreePreview(root) {
  const n = countNodes(root.children || []);
  if (!n) return "";
  return `<div class="tree-preview">${n} field(s) defined</div>`;
}

function renderPanel(side) {
  const s = state[side];
  const el = document.getElementById("panel-" + side);
  const title = side === "source" ? "Source structure" : "Destination structure";
  const cls = side === "source" ? "src" : "dst";

  let body = "";
  if (!s.method) {
    body = renderMethodCards(side);
  } else if (s.method === "manual") {
    body = `<div class="back-link" data-side="${side}" data-action="back">&larr; Change method</div>
      <div class="manual-note">You chose <strong>Build manually</strong>. Click Continue to open the schema builder with an empty tree for this side.</div>`;
  } else {
    const label = s.method === "schema" ? "schema file (.xsd / .json)" : "sample payload (.xml / .json)";
    body = `<div class="back-link" data-side="${side}" data-action="back">&larr; Change method</div>
      <div class="dropzone">
        <div class="dropzone-text">${s.filename ? s.filename : "Choose a " + label}</div>
        <button class="file-btn" data-side="${side}">${s.filename ? "Choose a different file" : "Choose file"}</button>
        <input type="file" accept=".json,.xml,.xsd,.txt" style="display:none" id="file-${side}" data-side="${side}" />
        ${s.status ? `<div class="parse-status ${s.status.type}">${s.status.text}</div>` : ""}
      </div>
      ${renderTreePreview(s.root)}`;
  }

  el.innerHTML = `
    <div class="panel-head">
      <span class="panel-title ${cls}">${title}</span>
      ${s.format ? `<span class="fmt-pill">${s.format}</span>` : ""}
    </div>${body}`;

  el.querySelectorAll(".method-card").forEach(card => {
    card.addEventListener("click", () => {
      const side = card.dataset.side;
      state[side].method = card.dataset.method;
      state[side].format = null;
      state[side].filename = null;
      state[side].status = null;
      if (card.dataset.method === "manual") {
        state[side].root = emptyRoot(side === "source" ? "source" : "target");
      } else {
        state[side].root = emptyRoot(side === "source" ? "source" : "target");
      }
      renderAll();
    });
  });

  el.querySelectorAll('[data-action="back"]').forEach(link => {
    link.addEventListener("click", () => {
      const side = link.dataset.side;
      state[side].method = null;
      state[side].root = emptyRoot(side === "source" ? "source" : "target");
      state[side].filename = null;
      state[side].status = null;
      state[side].format = null;
      renderAll();
    });
  });

  el.querySelectorAll(".file-btn").forEach(btn => {
    btn.addEventListener("click", () => document.getElementById("file-" + btn.dataset.side).click());
  });

  el.querySelectorAll('input[type="file"]').forEach(input => {
    input.addEventListener("change", e => handleFile(e.target.dataset.side, e.target.files[0]));
  });
}

async function handleFile(side, file) {
  if (!file) return;
  state[side].filename = file.name;
  state[side].status = { type: "ok", text: "Parsing..." };
  renderPanel(side);

  const text = await file.text();
  try {
    const mode = state[side].method === "schema"
      ? (text.trim().startsWith("<") ? "xsd" : "json-schema")
      : (text.trim().startsWith("<") ? "payload-xml" : "payload-json");
    const rootName = side === "source" ? "source" : "target";
    const result = await parseViaApi(mode, text, rootName);
    state[side].root = result.root;
    state[side].format = result.format;
    state[side].status = {
      type: result.format === "XML" ? "warn" : "ok",
      text: `Parsed ${result.fieldCount} field(s) from ${result.format}.`,
    };
  } catch (err) {
    state[side].status = { type: "error", text: err.message || "Could not parse file." };
    state[side].root = emptyRoot(side === "source" ? "source" : "target");
  }
  renderAll();
}

function isReady() {
  function sideOk(s) {
    if (!s.method) return false;
    if (s.method === "manual") return true;
    return countNodes(s.root.children || []) > 0 && s.status?.type !== "error";
  }
  return sideOk(state.source) && sideOk(state.destination);
}

function needsBuilder() {
  return state.source.method === "manual" || state.destination.method === "manual";
}

function renderAll() {
  renderPanel("source");
  renderPanel("destination");
  const btn = document.getElementById("continueBtn");
  const hint = document.getElementById("continueHint");
  btn.disabled = !isReady();
  hint.textContent = isReady() ? "" : "Choose a method for both source and destination.";
}

async function onContinue() {
  const mapperId = requireMapperId();
  if (!mapperId) return;

  const draft = {
    mapperId,
    source: { ...state.source },
    target: { ...state.destination },
  };
  saveDraft(draft);

  if (needsBuilder()) {
    location.href = `/schema-builder/?mapper=${encodeURIComponent(mapperId)}`;
    return;
  }

  const doc = buildSchemaDocument(mapperId, state.source, state.destination);
  try {
    await saveSchemaDoc(doc);
    toast("Schema saved");
    location.href = `/pipeline-viewer/?mapper=${encodeURIComponent(mapperId)}`;
  } catch (err) {
    toast(err.message);
  }
}

document.getElementById("continueBtn").addEventListener("click", onContinue);

const params = new URLSearchParams(location.search);
if (params.get("mapper")) {
  document.getElementById("mapperId").value = params.get("mapper");
}

const existing = loadDraft();
if (existing && existing.mapperId === getMapperId()) {
  state.source = { ...state.source, ...existing.source, root: existing.source.root || state.source.root };
  state.destination = { ...state.destination, ...existing.destination, root: existing.destination.root || state.destination.root };
}

renderAll();
</script>
</body>
</html>
