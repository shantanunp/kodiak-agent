<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Viewer — Kodiak Agent</title>
<style>
  :root{
    --bg:#EEF1EC; --panel:#FFFFFF; --ink:#17201C; --ink-soft:#5C665F; --ink-faint:#8B948D; --line:#DADFD9;
    --source:#0F6E56; --source-bg:#E1F3EC;
    --target:#9A5B0A; --target-bg:#FBEFDC;
    --op:#4A3F8C; --op-bg:#ECE9F8;
    --cond:#A32B4B; --cond-bg:#FBE7ED;
    --raw:#6B7280; --raw-bg:#F3F4F6;
    --font-display:ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body:ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono:ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  .app{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}
  header{margin-bottom:18px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .brand-mark{width:26px;height:26px;border-radius:6px;background:var(--ink);display:flex;align-items:center;justify-content:center;}
  .brand-mark span{width:10px;height:10px;border-radius:2px;background:var(--bg);}
  h1{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0;}
  .tagline{color:var(--ink-soft);font-size:13.5px;margin:4px 0 0 36px;}
  .meta-bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;font-size:12px;color:var(--ink-soft);}
  .pill{font-family:var(--font-mono);background:var(--panel);border:1px solid var(--line);padding:4px 10px;border-radius:6px;}
  .legend{display:flex;gap:16px;margin:12px 0;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
  .canvas{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px;}
  .tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap;}
  .tab{font-family:var(--font-mono);font-size:12px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;color:var(--ink-soft);}
  .tab.active{background:var(--target-bg);border-color:var(--target);color:var(--target);font-weight:600;}
  .target-name{font-family:var(--font-mono);font-size:15px;font-weight:500;color:var(--target);background:var(--target-bg);padding:3px 9px;border-radius:6px;display:inline-block;}
  .pipeline{margin-top:18px;padding-left:6px;}
  .step{display:flex;gap:14px;padding-bottom:20px;}
  .step-rail{position:relative;display:flex;flex-direction:column;align-items:center;width:30px;flex-shrink:0;}
  .step-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;border:2px solid var(--panel);}
  .step-line{position:absolute;top:28px;bottom:-20px;width:2px;background:repeating-linear-gradient(var(--line),var(--line) 4px,transparent 4px,transparent 8px);}
  .step:last-child .step-line{display:none;}
  .step-card{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;}
  .step-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  .step-body{margin-top:8px;font-size:13px;line-height:1.55;}
  .mono{font-family:var(--font-mono);font-size:12px;background:var(--panel);padding:2px 6px;border-radius:4px;border:1px solid var(--line);}
  .badge{font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:4px;margin-left:6px;}
  .badge-gemini,.badge-model{background:var(--op-bg);color:var(--op);}
  .badge-det{background:var(--source-bg);color:var(--source);}
  .badge-raw{background:var(--raw-bg);color:var(--raw);}
  .code-block{font-family:var(--font-mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:6px;white-space:pre-wrap;word-break:break-word;}
  .summary{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;font-size:13.5px;color:var(--ink-soft);line-height:1.7;}
  .error{color:var(--cond);padding:20px;background:var(--cond-bg);border-radius:8px;}
  .nested{margin-top:8px;padding-left:12px;border-left:2px solid var(--line);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="brand-mark"><span></span></div><h1>Pipeline Viewer</h1></div>
    <p class="tagline">Read-only view of indexed + labeled mapping logic (Phase 2)</p>
  </header>
  <div class="meta-bar" id="metaBar"></div>
  <div class="legend">
    <span><span class="dot" style="background:var(--source)"></span>Read</span>
    <span><span class="dot" style="background:var(--op)"></span>Transform / Build</span>
    <span><span class="dot" style="background:var(--cond)"></span>Filter</span>
    <span><span class="dot" style="background:var(--target)"></span>Write / Constant</span>
    <span><span class="dot" style="background:var(--raw)"></span>Raw / unclassified</span>
  </div>
  <div class="canvas" id="canvas"><p class="error">Loading…</p></div>
</div>
<script>
const ICONS = { read:'R', filter:'F', select:'Sel', transform:'Tx', build:'B', write:'W', constant:'C', raw:'?' };
const COLOR = { read:'--source', filter:'--cond', select:'--op', transform:'--op', build:'--op', write:'--target', constant:'--target', raw:'--raw' };
const BG = { read:'--source-bg', filter:'--cond-bg', select:'--op-bg', transform:'--op-bg', build:'--op-bg', write:'--target-bg', constant:'--target-bg', raw:'--raw-bg' };
const LABELS = { read:'Read', filter:'Filter', select:'Select', transform:'Transform', build:'Build object', write:'Write to target', constant:'Constant', raw:'Unclassified (raw)' };

function badge(step) {
  if (step.kind === 'raw') return '<span class="badge badge-raw">needs review</span>';
  if (step.labelSource === 'model' || step.labelSource === 'gemini') return '<span class="badge badge-model">AI labeled</span>';
  return '<span class="badge badge-det">deterministic</span>';
}

function renderStepBody(step) {
  if (step.kind === 'read') return `Field <span class="mono">${esc(step.field)}</span>`;
  if (step.kind === 'filter') {
    let inner = `When <span class="mono">${esc(step.value || step.op)}</span>`;
    if (step.children?.length) inner += `<div class="nested">${step.children.map(renderStep).join('')}</div>`;
    return inner;
  }
  if (step.kind === 'select') return `Take <span class="mono">${esc(step.mode)}</span>`;
  if (step.kind === 'transform') {
    let t = `Apply <span class="mono">${esc(step.op)}</span>`;
    if (step.field2) {
      t += ` to <span class="mono">${esc(step.field)}</span> and <span class="mono">${esc(step.field2)}</span>`;
    }
    if (step.param !== undefined) t += ` · param <span class="mono">${esc(String(step.param))}</span>`;
    return t;
  }
  if (step.kind === 'build') {
    const rows = (step.rows || []).map(r => `<span class="mono">${esc(r.source)}</span> → <span class="mono">${esc(r.target)}</span>`).join(', ');
    return rows ? `Map fields: ${rows}` : `Create object${step.sourceText ? '' : ''}`;
  }
  if (step.kind === 'write') return `Save to <span class="mono">${esc(step.target)}</span>`;
  if (step.kind === 'constant') {
    return `Set <span class="mono">${esc(step.target)}</span> to <span class="mono">${esc(step.value ?? '')}</span>`;
  }
  if (step.kind === 'raw') return `Could not classify automatically`;
  return esc(step.sourceText || '');
}

function renderStep(step, opts = {}) {
  const k = step.kind;
  const showReason = opts.showReason && step.labelReason;
  return `<div class="step">
    <div class="step-rail"><div class="step-icon" style="background:var(${BG[k]});color:var(${COLOR[k]})">${ICONS[k]||'?'}</div><div class="step-line"></div></div>
    <div class="step-card">
      <div class="step-kicker" style="color:var(${COLOR[k]})">${LABELS[k]||k}${badge(step)}</div>
      <div class="step-body">${renderStepBody(step)}</div>
      ${step.sourceText ? `<div class="code-block">${esc(step.sourceText)}</div>` : ''}
      ${showReason ? `<div style="font-size:11px;color:var(--ink-faint);margin-top:6px;line-height:1.45">${esc(step.labelReason)}</div>` : ''}
    </div>
  </div>`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function summarize(steps) {
  return steps.map(s => {
    if (s.kind === 'read') return `read ${s.field}`;
    if (s.kind === 'transform') return `${s.op}(${s.field}${s.field2?', '+s.field2:''})`;
    if (s.kind === 'write') return `write ${s.target}`;
    if (s.kind === 'constant') return `constant ${s.target}=${s.value??''}`;
    if (s.kind === 'filter') return `filter ${s.value||''}`;
    if (s.kind === 'build') return 'build object';
    if (s.kind === 'raw') return 'raw (review)';
    return s.kind;
  }).join(', then ') + '.';
}

function fieldLeaf(path) {
  if (!path) return '';
  const parts = String(path).split('.');
  return parts[parts.length - 1] || path;
}

function render(data, activeFieldIndex) {
  document.getElementById('metaBar').innerHTML = [
    `<span class="pill">${esc(data.mapperId)}</span>`,
    data.className ? `<span class="pill">${esc(data.className)}</span>` : '',
    data.labeledAt ? `<span class="pill">labeled ${esc(data.labeledAt.slice(0,19))}</span>` : '',
    data.labelModel ? `<span class="pill">${esc(data.labelModel)}</span>` : '',
    `<a class="pill" href="/structure-setup/?mapper=${encodeURIComponent(data.mapperId)}" style="text-decoration:none;color:inherit">Edit schema</a>`,
  ].join('');

  const fields = Array.isArray(data.fields) ? data.fields : null;
  let steps = data.steps || [];
  let targetLabel = data.target;
  let tabsHtml = '';

  if (fields && fields.length > 0) {
    const idx = Math.min(Math.max(activeFieldIndex || 0, 0), fields.length - 1);
    const active = fields[idx];
    steps = active.steps || [];
    targetLabel = active.targetField;
    if (fields.length > 1) {
      tabsHtml = `<div class="tabs">${fields.map((f, i) =>
        `<button type="button" class="tab${i === idx ? ' active' : ''}" data-field-idx="${i}">${esc(fieldLeaf(f.targetField))}</button>`
      ).join('')}</div>`;
    }
  }

  const reasonIdx = steps.findIndex((s) => s.labelReason);
  document.getElementById('canvas').innerHTML = `
    ${tabsHtml}
    <span class="target-name">${esc(targetLabel)}</span>
    <div class="pipeline">${steps.map((s, i) => renderStep(s, { showReason: i === reasonIdx })).join('')}</div>
    <div class="summary"><strong>Summary:</strong> ${esc(summarize(steps))}</div>`;

  document.querySelectorAll('.tab[data-field-idx]').forEach((btn) => {
    btn.addEventListener('click', () => {
      render(data, Number(btn.getAttribute('data-field-idx')));
    });
  });
}

async function load() {
  const params = new URLSearchParams(location.search);
  const mapper = params.get('mapper') || 'demo-ai-recognition-mapper';
  try {
    const viewRes = await fetch(`/data/${mapper}.view.json?t=${Date.now()}`);
    if (!viewRes.ok) {
      throw new Error(`No pipeline view for ${mapper}. Run: npm run label -- --mapper ${mapper}`);
    }
    render(await viewRes.json(), 0);
  } catch (e) {
    document.getElementById('canvas').innerHTML = `<p class="error">${esc(e.message)}</p>`;
  }
}
load();
</script>
</body>
</html>
