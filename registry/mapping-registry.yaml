repo: "shantanunp/ktransform"
branch: "main"
scope:
  - "src/main/java/com/kodiakservice/mapper/**/*.java"
mappers:
  - id: order-request-mapper
    sourceFile: src/main/java/com/kodiakservice/mapper/OrderRequestMapper.java
    class: com.kodiakservice.mapper.OrderRequestMapper
    entryMethod: map
    sourceType: com.kodiakservice.dto.input.OrderRequest
    targetType: com.kodiakservice.dto.output.OrderMappedResponse
    goldenTests: src/test/java/com/kodiakservice/mapper/OrderRequestMapperTest.java
    persistence:
      framework: spring-boot-jpa
      entityPackage: com.kodiakservice.entity
      repositoryPackage: com.kodiakservice.repository