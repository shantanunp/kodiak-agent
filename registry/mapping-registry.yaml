repo: "your-org/your-mapper-repo"
branch: "main"
scope:
  - "src/main/java/com/kodiakservice/mapper/**/*.java"
mappers:
  - id: demo-ai-recognition-mapper
    sourceFile: src/main/java/com/kodiakservice/mapper/DemoAiRecognitionMapper.java
    class: com.kodiakservice.mapper.DemoAiRecognitionMapper
    entryMethod: map
    sourceType: com.kodiakservice.mapper.DemoAiRecognitionMapper$Person
    targetType: com.kodiakservice.mapper.DemoAiRecognitionMapper$Summary
    goldenTests: src/test/java/com/kodiakservice/mapper/DemoAiRecognitionMapperTest.java

  - id: order-request-mapper
    sourceFile: src/main/java/com/kodiakservice/mapper/OrderRequestMapper.java
    class: com.kodiakservice.mapper.OrderRequestMapper
    entryMethod: map
    sourceType: com.kodiakservice.dto.input.OrderRequest
    targetType: com.kodiakservice.dto.output.OrderMappedResponse
    goldenTests: src/test/java/com/kodiakservice/mapper/OrderRequestMapperTest.java
    persistence:
      framework: spring-boot-jpa
      entityPackage: com.kodiakservice.entity
      repositoryPackage: com.kodiakservice.repository

  - id: lpa-request-mapper
    sourceFile: src/main/java/com/kodiakservice/mapper/LpaRequestMapper.java
    class: com.kodiakservice.mapper.LpaRequestMapper
    entryMethod: map
    sourceType: com.kodiakservice.dto.input.LoanApplicationRequest
    targetType: com.kodiakservice.dto.output.LpaMappedResponse
    goldenTests: src/test/java/com/kodiakservice/mapper/LpaRequestMapperTest.java




